# ===== APPLICATION =====
spring.application.name=auth-service
server.port=8081

# ===== DATABASE (auth_db) =====
# Moi may cau hinh MySQL khac nhau: dat bien moi truong DB_PORT / DB_USERNAME / DB_PASSWORD
# trong IntelliJ (Run > Edit Configurations > Environment variables) thay vi sua file nay.
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== JWT (secret dung chung voi cac service) =====
jwt.secret=CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te
jwt.expiration-ms=86400000

spring.jackson.time-zone=Asia/Ho_Chi_Minh
