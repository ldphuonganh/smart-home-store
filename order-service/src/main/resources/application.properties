server.port=8083

spring.application.name=order-service

# ===============================
# JWT
# ===============================
jwt.secret=CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te

# ===============================
# MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Product Service (goi API noi bo, khong qua Gateway)
# ===============================
product-service.base-url=http://localhost:8082

# true  = lay ten, gia, ton kho that tu product-service va tru/hoan kho khi dat/huy don
# false = chi dung khi test doc lap khong bat product-service (lay ten/gia client gui len)
product-service.validation-enabled=true
