server.port=8083
# Doc cau hinh rieng tung may tu file order-service/.env (da gitignore)
spring.config.import=optional:file:.env[.properties],optional:file:order-service/.env[.properties]
spring.application.name=order-service

# ===== JWT (secret dung chung) =====
jwt.secret=CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te

# ===== MySQL (order_db) =====
# Moi may MySQL khac nhau: dat bien moi truong DB_PORT / DB_USERNAME / DB_PASSWORD trong IntelliJ
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== Product Service (API noi bo, khong qua Gateway) =====
product-service.base-url=${PRODUCT_SERVICE_URL:http://localhost:8082}

# ===== Nghiep vu cua hang (giong config/shop.php cua SmartHome Store) =====
shop.free-shipping-threshold=500000
shop.fee-noi-thanh=20000
shop.fee-tinh-khac=30000
shop.fee-vung-xa=45000
shop.express-surcharge=25000
shop.item-weight-grams=500
shop.max-parcel-weight-grams=20000
# Don thanh toan online chua tra tien sau 30 phut se tu huy va hoan kho (kiem tra moi 5 phut)
shop.payment-timeout-minutes=30
shop.cancel-unpaid-interval-ms=300000
# Bat khi payment-service da cau hinh khoa PayPal (payment.paypal.client-id/secret)
shop.paypal-enabled=${PAYPAL_ENABLED:false}

# ===== Viettel Post (API cong khai: dia gioi + bang cuoc that) =====
# May khong co Internet -> tu dong dung bang phi theo khu vuc cua shop
viettelpost.enabled=true
viettelpost.base-url=https://partner.viettelpost.vn/v2
viettelpost.timeout-seconds=8
# Kho gui hang: Ha Noi (province 1, district 1 theo danh muc Viettel Post)
viettelpost.origin.province-id=1
viettelpost.origin.district-id=1
