server.port=8084
spring.application.name=cart-service

# Moi may MySQL khac nhau: dat bien moi truong DB_PORT / DB_USERNAME / DB_PASSWORD
# trong IntelliJ (Run > Edit Configurations > Environment variables), khong sua file nay.
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/cart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te

# Goi API noi bo cua product-service (khong qua Gateway)
product-service.base-url=http://localhost:8082
