# ===== APPLICATION =====
spring.application.name=payment-service
server.port=8085

# ===== DATABASE (payment_db) =====
# Moi may MySQL khac nhau: dat bien moi truong DB_PORT / DB_USERNAME / DB_PASSWORD
# trong IntelliJ (Run > Edit Configurations > Environment variables), khong sua file nay.
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== JWT (secret dung chung) =====
jwt.secret=CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te

# ===== Goi API noi bo cua order-service (khong qua Gateway) =====
order-service.base-url=http://localhost:8083

# ===== Thong tin chuyen khoan hien thi cho khach (gia lap, co the doi) =====
payment.bank.bin=970436
payment.bank.name=Vietcombank
payment.bank.account-no=0123456789
payment.bank.account-name=SMARTHOME STORE

spring.jackson.time-zone=Asia/Ho_Chi_Minh
